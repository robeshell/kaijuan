name: kaijuan
description: "开卷 — a local reader for page-image and reflow content."
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fluentui_system_icons: ^1.1.273

  # Persistence
  drift: ^2.34.1
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Import & identity
  file_selector: ^1.1.0
  file_picker: ^12.0.0-beta.7
  crypto: ^3.0.7
  archive: ^4.0.7

  package_info_plus: ^10.2.1
  http: ^1.6.0
  xml: ^6.5.0
  flutter_secure_storage: ^10.3.1
  open_filex: ^4.7.0

  # Book reader
  image: ^4.1.7
  flutter_inappwebview: ^6.2.0-beta.3
  url_launcher: ^6.3.1
  pointer_interceptor: ^0.10.1+2
  share_plus: ^13.2.1
  gal: ^2.3.1
  flutter_tts: ^4.2.5
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  network_info_plus: ^8.2.1
  qr_flutter: ^4.1.0
  thinking_orbs: ^0.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  drift_dev: ^2.34.2+1
  flutter_lints: ^6.0.0
  msix: ^3.16.12

# Windows MSIX packaging (used by `dart run tool/release.dart windows`).
# Version is overridden at release time from the pubspec version field.
msix_config:
  display_name: 开卷
  publisher_display_name: com.kaijuan.reader
  identity_name: com.kaijuan.reader
  publisher: CN=com.kaijuan.reader
  msix_version: 0.1.1.0
  logo_path: macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png
  capabilities: internetClient, privateNetworkClientServer
  languages: zh-cn, en-us
  architecture: x64
  install_certificate: false

dependency_overrides:
  # Upstream 1.2.0-beta.3 declares macOS 10.14 while using APIs available
  # from 10.15. Keep the Apache-2.0 package local until the fix is released.
  flutter_inappwebview_macos:
    path: third_party/flutter_inappwebview_macos
  # Upstream always calls super.buildMenu, which injects iOS 18.2+
  # "Copy Link with Highlight" even when disableContextMenu is true.
  # Local fork skips super + disables Writing Tools (readium/swift-toolkit#509).
  flutter_inappwebview_ios:
    path: third_party/flutter_inappwebview_ios

flutter:
  uses-material-design: true
  assets:
    - brands/launch/launch_mark.png
    - brands/icons/comic/master_1024.png
    - assets/book/FOLIATE_UPSTREAM_LICENSE
    - assets/book/UPSTREAM_ATTRIBUTION.md
    - assets/book/foliate-js/index.html
    - assets/book/foliate-js/metadata-probe.html
    - assets/book/foliate-js/dist/
    - assets/book/foliate-js/src/
    - assets/book/foliate-js/src/vendor/
    - assets/book/foliate-js/src/vendor/pdfjs/
    - assets/book/foliate-js/src/vendor/prism/
    - assets/book/foliate-js/src/vendor/prism/components/
    - assets/book/foliate-js/src/vendor/prism/themes/
