<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kaika Reader</title>
<script>
  // Apply reading theme before Foliate loads so the canvas never flashes
  // the WebView default white while zip.js / book.js are still starting.
  (function () {
    try {
      const raw = new URLSearchParams(window.location.search).get('style');
      if (!raw) return;
      const style = JSON.parse(raw);
      const bg = style && style.backgroundColor;
      if (!bg) return;
      const root = document.documentElement;
      root.style.backgroundColor = bg;
      if (document.body) document.body.style.backgroundColor = bg;
      else {
        document.addEventListener('DOMContentLoaded', function () {
          document.body.style.backgroundColor = bg;
        });
      }
    } catch (_) {}
  })();
</script>
<style>
  html {
    height: 100vh;
    overflow: hidden;
    background: #ffffff;
    /* Desktop: host chrome is not editable text; avoid UA I-beam on empty shell. */
    cursor: default;
  }

  body {
    user-select: none;
    -webkit-touch-callout: none;
    margin: 0 !important;
    height: 100vh;
    background: #ffffff;
    cursor: default;
  }

  #footnote-dialog {
    position: fixed;
    box-sizing: border-box;
    width: 80vw;
    height: 200px;
    max-width: 400px;
    max-height: 200px;
    min-width: 300px;
    min-height: 200px;
    border-radius: 14px;
    border: 1px solid rgba(0, 0, 0, 0.12);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06);
    user-select: none;
    outline: none;
    z-index: 1000;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #footnote-dialog main {
    box-sizing: border-box;
    overflow: auto;
    width: 100%;
    height: 100%;
    padding: 16px 20px;
    -webkit-overflow-scrolling: touch;
  }

  #footnote-dialog foliate-view,
  #footnote-dialog foliate-paginator {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
<div id="footnote-dialog">
  <main></main>
</div>
<script>
  // Prevent the default WebView2 right-click context menu on Windows.
  document.addEventListener('contextmenu', e => { e.preventDefault(); });
</script>
<script>
  window.__kaijuanOpen = (function () {
    var t0 = performance.now();
    var prev = t0;
    function mark(step, extra) {
      var now = performance.now();
      var elapsed = Math.round(now - t0);
      var delta = Math.round(now - prev);
      prev = now;
      var line = 'KaikaOpen step=' + step + ' t=' + elapsed + ' d=' + delta;
      if (extra) line += ' ' + extra;
      console.log(line);
    }
    mark('html-boot');
    return { mark: mark };
  })();
</script>
<script>
  (function () {
    const ua = navigator.userAgent || '';
    const platform = navigator.platform || '';
    console.log('KaikaUA', ua);

    const isAppleDevice = /iPad|iPhone|iPod/.test(ua)
      || (/Mac/.test(platform) && navigator.maxTouchPoints > 1)
      || /Mac OS X/.test(ua);

    const chromeMatch = ua.match(/Chrome\/(\d+)/);
    const chromeVersion = chromeMatch ? parseInt(chromeMatch[1], 10) : NaN;
    const shouldUseModernBundle = isAppleDevice || (!Number.isNaN(chromeVersion) && chromeVersion >= 100);

    const loadScript = (src, options = {}) => new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      if (options.type) script.type = options.type;
      if (options.async !== undefined) script.async = options.async;
      if (options.defer !== undefined) script.defer = options.defer;
      script.onload = () => resolve();
      script.onerror = (err) => {
        console.error('Failed to load script', src, err);
        reject(err);
      };
      document.head.appendChild(script);
    });

    (async () => {
      // PDF.js is only needed for PDF files. book.js lazy-imports src/pdf.js
      // when it sees a PDF; that wrapper expects the global vendor build.
      // Loading 555KB+ of pdf.js on every EPUB open (especially mobile
      // WebView) delays first paint for no reason.
      const params = new URLSearchParams(window.location.search);
      const needsPdf = params.get('pdf') === '1';
      const mark = (step, extra) => {
        try { window.__kaijuanOpen && window.__kaijuanOpen.mark(step, extra); }
        catch (_) {}
      };

      if (shouldUseModernBundle) {
        if (needsPdf) {
          await loadScript('./src/vendor/pdfjs/pdf.js', { async: false, defer: false });
          mark('pdfjs-loaded');
        }
        mark('book-js-request');
        await loadScript('./src/book.js?v=20260813b', { type: 'module' });
        mark('book-js-script');
        return;
      }

      mark('bundle-request');
      await loadScript('./dist/bundle.js', { type: 'module' });
      mark('bundle-script');
      if (needsPdf) {
        await loadScript('./dist/pdf-legacy.js', { async: false, defer: false });
        mark('pdfjs-loaded');
      }
    })();
  })();
</script>
