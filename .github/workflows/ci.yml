name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout Kai brand tokens
        uses: actions/checkout@v6
        with:
          repository: robeshell/kai-brand-design
          path: .kai-brand-design

      - name: Verify generated brand tokens
        run: |
          python3 .kai-brand-design/tool/kai_design.py check --skip-viewer
          cmp .kai-brand-design/dist/release/kai-design.lock.json kai-design.lock.json
          cmp .kai-brand-design/dist/flutter/kaijuan/brand_tokens.g.dart lib/core/theme/brand_tokens.g.dart

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache build_runner output
        uses: actions/cache@v5
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('lib/**.dart', 'test/**.dart') }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-
            build-runner-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test
